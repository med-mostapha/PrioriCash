include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Promoted to errors: each has produced a real defect class in
    # money-handling code before.
    invalid_assignment: error
    argument_type_not_assignable: error
    unused_import: error
    dead_code: error

    # Nullability is how "no target set = free balance" is represented in the
    # allocation ledger. Silencing these hides ledger bugs.
    unnecessary_null_comparison: error
    invalid_null_aware_operator: error

  exclude:
    - "lib/generated/**" # flutter_intl / intl_utils output
    - "**/*.g.dart" # Drift codegen
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # --- Correctness -------------------------------------------------------
    always_use_package_imports: true
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true
    valid_regexps: true

    # --- Immutability ------------------------------------------------------
    # Money and Recurrence are value objects. Mutating one in place is how a
    # balance changes without a ledger row.
    prefer_final_fields: true
    prefer_final_locals: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    avoid_setters_without_getters: true

    # --- Equality ----------------------------------------------------------
    # Money is compared throughout the engine. A missing hashCode makes set
    # and map behaviour silently wrong.
    hash_and_equals: true
    avoid_equals_and_hash_code_on_mutable_classes: true

    # --- Clarity -----------------------------------------------------------
    always_declare_return_types: true
    avoid_positional_boolean_parameters: true # isEssential must be named
    sort_constructors_first: true
    unnecessary_parenthesis: true
    use_super_parameters: true

    # --- Async -------------------------------------------------------------
    # Allocation runs inside a transaction; a dropped future there corrupts
    # the ledger silently.
    avoid_void_async: true
    unawaited_futures: true
    discarded_futures: true
